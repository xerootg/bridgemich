name: Build and Release Android APK

# Every build is signed with the one release key stored in the repo secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), so any APK from
# here updates an installed copy in place. Pushes to main build an artifact;
# v* tags also publish a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # SHA-256 of the release signing certificate. The build fails if the APK is
  # signed with anything else, so a lost or swapped key can't silently ship an
  # APK that won't install over the existing one.
  EXPECTED_CERT_SHA256: 7f54b9382a3b38417b0da980b830ff9bae7cecd7ad529d0995135b66f7f213c1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to build an unsigned or debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify signing certificate
        if: github.event_name != 'pull_request'
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest/{print $NF; exit}')
          echo "signed with $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with $GOT, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          rm -f app/release.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          path: app/build/outputs/apk/*/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TAG="${GITHUB_REF#refs/tags/}"
          cp "$APK" "bridgemich-$TAG.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "bridgemich-$TAG.apk" --clobber
